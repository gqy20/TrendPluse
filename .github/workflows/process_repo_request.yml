name: 处理仓库添加请求

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: |
      contains(github.event.issue.labels.*.name, 'add-repo') &&
      github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 解析 Issue
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # 解析 GitHub 仓库
          REPO=$(echo "$ISSUE_BODY" | sed -n '/### GitHub 仓库/,/###/p' | grep -oP '^[a-zA-Z0-9_-]+/[a-zA-Z0-9._-]+$' | head -1 || echo "")

          # 解析分类
          CATEGORY=$(echo "$ISSUE_BODY" | sed -n '/### 分类/,/###/p' | grep -vP '^###' | grep -vP '^$' | head -1 | xargs || echo "")

          # 解添加理由
          REASON=$(echo "$ISSUE_BODY" | sed -n '/### 添加理由/,/###/p' | sed '1d;$d' | tr -d '\n\r' | sed 's/^\s*-\s*\[x\]\s*//' | head -c 200 || echo "")

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "category=$CATEGORY" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

          echo "仓库: $REPO"
          echo "分类: $CATEGORY"

      - name: 验证仓库格式
        id: validate_format
        run: |
          REPO="${{ steps.parse.outputs.repo }}"

          if [[ ! "$REPO" =~ ^[a-zA-Z0-9_-]+/[a-zA-Z0-9._-]+$ ]]; then
            echo "❌ 仓库格式错误: $REPO"
            echo "format_error=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ 格式验证通过"

      - name: 验证仓库存在
        id: validate_exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ steps.parse.outputs.repo }}"

          if ! gh api repos/$REPO --silent 2>/dev/null; then
            echo "❌ 仓库不存在: $REPO"
            echo "not_found=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ 仓库验证通过"

      - name: 检查仓库是否已监控
        id: check_duplicate
        run: |
          REPO="${{ steps.parse.outputs.repo }}"

          if grep -q "\"${REPO}\"" src/trendpluse/config.py; then
            echo "❌ 仓库已在监控列表中: $REPO"
            echo "duplicate=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ 仓库未被监控"

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 安装 uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: 添加仓库到配置
        run: |
          uv run python scripts/add_repo.py \
            --repo "${{ steps.parse.outputs.repo }}" \
            --category "${{ steps.parse.outputs.category }}"

      - name: 提交并推送变更
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add src/trendpluse/config.py
          git diff --quiet && git diff --staged --quiet || git commit -m "feat: 添加监控仓库 ${{ steps.parse.outputs.repo }}"
          git push

      - name: 关闭 Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --comment "✅ **仓库已成功添加到监控列表**

          - **仓库**: \`${{ steps.parse.outputs.repo }}\`
          - **分类**: ${{ steps.parse.outputs.category }}
          - **提交**: 已自动提交到 main 分支

          变更将在下次趋势分析中生效。"

      - name: 评论验证失败
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            let errorMsg = '❌ 添加仓库失败：\n\n';

            if ('${{ steps.validate_format.outputs.format_error }}' === 'true') {
              errorMsg += '- 仓库格式错误，请检查是否为 `owner/repo` 格式\n';
            }
            if ('${{ steps.validate_exists.outputs.not_found }}' === 'true') {
              errorMsg += '- 仓库不存在或无法访问\n';
            }
            if ('${{ steps.check_duplicate.outputs.duplicate }}' === 'true') {
              errorMsg += '- 仓库已在监控列表中\n';
            }

            if (errorMsg === '❌ 添加仓库失败：\n\n') {
              errorMsg += '未知错误，请查看 Action 日志';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: errorMsg
            });
