name: Weekly Report

on:
  schedule:
    # 每周一 UTC 0:05 运行 (北京时间 8:05)
    - cron: '05 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    name: Generate Weekly Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/run_weekly.py

      - name: Sync reports to docs
        run: uv run python scripts/generate_report_index.py

      - name: Commit weekly report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/weekly/*.md reports/weekly/*.json docs/reports/*.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update weekly trend report [skip ci]"
          git push
