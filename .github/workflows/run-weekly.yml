name: Weekly Report

on:
  schedule:
    # 每周一 UTC 0:05 运行 (北京时间 8:05)
    - cron: '05 0 * * 1'
  workflow_dispatch:
    inputs:
      send_notification:
        description: '是否发送周报飞书通知'
        required: false
        type: boolean
        default: true
      week_id:
        description: '周标识 (YYYY-Www)，默认上周'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  weekly:
    name: Generate Weekly Report
    runs-on: ubuntu-latest
    outputs:
      week_id: ${{ steps.week_id.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Resolve week id
        id: week_id
        env:
          INPUT_WEEK_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.week_id || '' }}
        run: |
          if [ -n "$INPUT_WEEK_ID" ]; then
            WEEK_ID="$INPUT_WEEK_ID"
          else
            WEEK_ID=$(python -c "from datetime import datetime, timedelta; from trendpluse.models.signal import WeeklyReport; current = datetime.now(); weekday = current.weekday(); this_monday = current - timedelta(days=weekday); last_sunday = this_monday - timedelta(days=1); print(WeeklyReport.get_week_id(last_sunday))")
          fi
          echo "value=$WEEK_ID" >> "$GITHUB_OUTPUT"

      - name: Generate weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'glm-4.7' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK_ID: ${{ steps.week_id.outputs.value }}
        run: uv run trendpluse-run-weekly

      - name: Sync reports to docs
        run: uv run trendpluse-generate-report-index

      - name: Commit weekly report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/weekly/*.md reports/weekly/*.json docs/reports/*.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update weekly trend report [skip ci]"
          git push

  notify:
    name: Send Weekly Feishu Notification
    needs: weekly
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.send_notification == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Send weekly feishu notification
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'glm-4.7' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_AT_MOBILES: ${{ secrets.FEISHU_AT_MOBILES }}
          WEEK_ID: ${{ needs.weekly.outputs.week_id }}
        run: uv run trendpluse-send-weekly-feishu
