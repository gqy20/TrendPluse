name: Discover Projects

on:
  # 每天 UTC 19:00 运行 (北京时间凌晨 3:00)
  schedule:
    - cron: "0 19 * * *"

  # 支持手动触发
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数"
        required: false
        type: number
        default: 30
      min_quality:
        description: "最低质量分数"
        required: false
        type: number
        default: 60.0
      bridge_mode:
        description: "discovery 到监控列表桥接模式 (off/preview/apply)"
        required: false
        type: choice
        default: "preview"
        options:
          - off
          - preview
          - apply
      max_add_per_run:
        description: "bridge 每次最多新增仓库数量"
        required: false
        type: number
        default: 10

  # 允许从其他 workflow 调用
  workflow_call:
    inputs:
      days:
        required: false
        type: number
        default: 30
      min_quality:
        required: false
        type: number
        default: 60.0
      bridge_mode:
        required: false
        type: string
        default: "preview"
      max_add_per_run:
        required: false
        type: number
        default: 10

permissions:
  contents: write

jobs:
  discover:
    name: Discover Projects
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Discover projects
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'glm-4.7' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAYS=${{ inputs.days || github.event.inputs.days || 30 }}
          MIN_QUALITY=${{ inputs.min_quality || github.event.inputs.min_quality || 60.0 }}
          uv run trendpluse-discover-projects \
            --days $DAYS \
            --min-quality $MIN_QUALITY \
            --output-dir reports

      - name: Bridge discovery to monitoring (preview/apply)
        env:
          BRIDGE_MODE: ${{ inputs.bridge_mode || github.event.inputs.bridge_mode || 'preview' }}
          MAX_ADD_PER_RUN: ${{ inputs.max_add_per_run || github.event.inputs.max_add_per_run || 10 }}
        run: |
          set -e
          BRIDGE_RESULT_FILE="reports/discovery/discovery-bridge-result.json"
          if [ "$BRIDGE_MODE" = "off" ]; then
            echo "Bridge mode is off; skip."
            echo '{"mode":"off","status":"skipped"}' > "$BRIDGE_RESULT_FILE"
            exit 0
          fi

          ACTIONABLE_FILE=$(ls -1t reports/discovery/discovery-*-actionable.json | head -1 || true)
          if [ -z "$ACTIONABLE_FILE" ]; then
            echo "No actionable file found; skip bridge."
            echo '{"mode":"'"$BRIDGE_MODE"'","status":"no_actionable_file"}' > "$BRIDGE_RESULT_FILE"
            exit 0
          fi

          echo "Using actionable file: $ACTIONABLE_FILE"
          APPLY_FLAG=""
          if [ "$BRIDGE_MODE" = "apply" ]; then
            APPLY_FLAG="--apply"
          fi

          uv run trendpluse-bridge-discovery \
            --actionable-file "$ACTIONABLE_FILE" \
            --config-file repos.json \
            --min-priority medium \
            --max-add-per-run "$MAX_ADD_PER_RUN" \
            $APPLY_FLAG | tee "$BRIDGE_RESULT_FILE"

      - name: Upload bridge result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-bridge-result
          path: reports/discovery/discovery-bridge-result.json
          retention-days: 30

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: discovery-reports
          path: reports/discovery/discovery-*.md
          retention-days: 30

      - name: Upload JSON reports
        uses: actions/upload-artifact@v7
        with:
          name: discovery-reports-json
          path: reports/discovery/discovery-*.json
          retention-days: 30

      - name: Commit and push reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/discovery/*.md reports/discovery/*.json repos.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update discovery outputs and monitoring list [skip ci]"
          git push
