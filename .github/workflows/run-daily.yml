name: Run Daily Analysis

on:
  schedule:
    # 每天 UTC 21:00 运行 (北京时间 5:00)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      send_notification:
        description: '是否发送飞书通知'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: "run-daily"
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze GitHub Trends
    runs-on: ubuntu-latest
    outputs:
      report_date: ${{ steps.report_date.outputs.date }}
      has_report: ${{ steps.check_report.outputs.exists }}
      issue_agent_status: ${{ steps.issue_agent_status.outputs.status }}
      issue_agent_quality_status: ${{ steps.issue_agent_status.outputs.quality_status }}
      issue_agent_failed_files: ${{ steps.issue_agent_status.outputs.failed_files }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Get report date
        id: report_date
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Run TrendPulse analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'glm-4.7' }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_ISSUE_AGENT_ANALYSIS: "true"
          ISSUE_AGENT_MODEL: ${{ secrets.ISSUE_AGENT_MODEL || '' }}
          REPORT_DATE: ${{ steps.report_date.outputs.date }}
          LOG_LEVEL: INFO
        run: uv run trendpluse-run

      - name: Check if report exists
        id: check_report
        run: |
          REPORT_JSON="reports/daily/report-${{ steps.report_date.outputs.date }}.json"
          if [ -f "$REPORT_JSON" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found report: $REPORT_JSON"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Missing report: $REPORT_JSON"
          fi

      - name: Evaluate Issue Agent status
        id: issue_agent_status
        run: |
          uv run python - <<'PY'
          import os
          from trendpluse.utils.issue_agent_io import (
              load_issue_agent_report,
              summarize_issue_agent_run_status,
          )

          report_date = os.environ["REPORT_DATE"]
          report = load_issue_agent_report("data/issues", report_date)
          status = summarize_issue_agent_run_status(report)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"status={status}\n")
              fh.write(f"quality_status={report.quality_status}\n")
              fh.write(f"failed_files={report.failed_files}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Issue Agent 状态\n")
              fh.write(f"- status: `{status}`\n")
              fh.write(f"- quality_status: `{report.quality_status}`\n")
              fh.write(f"- expected_files: `{report.expected_files}`\n")
              fh.write(f"- parsed_files: `{report.parsed_files}`\n")
              fh.write(f"- failed_files: `{report.failed_files}`\n")
              if report.failed_samples:
                  samples = ", ".join(report.failed_samples)
                  fh.write(f"- failed_samples: `{samples}`\n")
          PY
        env:
          REPORT_DATE: ${{ steps.report_date.outputs.date }}

      - name: Validate Daily Summary fields
        if: steps.check_report.outputs.exists == 'true'
        env:
          REPORT_DATE: ${{ steps.report_date.outputs.date }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from trendpluse.utils.daily_summary_validation import (
              validate_smoke_daily_summary,
          )

          report_path = Path("reports/daily") / f"report-{os.environ['REPORT_DATE']}.json"
          data = json.loads(report_path.read_text(encoding="utf-8"))

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as fh:
              fh.write("## Daily Summary 校验\n")
              try:
                  validate_smoke_daily_summary(data)
              except ValueError as exc:
                  print(f"::warning::Daily summary validation degraded: {exc}")
                  fh.write(f"- status: `warning`\n")
                  fh.write(f"- reason: `{exc}`\n")
                  fh.write(
                      f"- trend_status: `{data.get('trend_status')}`\n"
                  )
                  fh.write(
                      f"- summary_confidence: `{data.get('summary_confidence')}`\n"
                  )
              else:
                  fh.write("- status: `ok`\n")
                  fh.write(
                      f"- trend_status: `{data.get('trend_status')}`\n"
                  )
                  fh.write(
                      f"- summary_confidence: `{data.get('summary_confidence')}`\n"
                  )
          PY

      - name: Upload report artifacts
        if: steps.check_report.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trend-report-${{ steps.report_date.outputs.date }}
          path: |
            reports/daily/report-*.md
            reports/daily/report-*.json
            logs/*.log
          retention-days: 30

      - name: Sync reports to docs
        if: steps.check_report.outputs.exists == 'true'
        run: |
          uv run trendpluse-generate-report-index

      - name: Commit report and docs
        if: steps.check_report.outputs.exists == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git stash
          git pull --rebase origin main
          git stash pop || true
          # 添加报告文件（包括 JSON 数据）- 使用子目录结构
          git add reports/daily/*.md reports/daily/*.json docs/reports/*.md docs/discovery*.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update daily trend report [skip ci]"
          git push

      - name: Warn if Issue Agent degraded
        if: steps.issue_agent_status.outputs.status == 'partial_failure' || steps.issue_agent_status.outputs.status == 'failed'
        run: |
          echo "::warning::Issue Agent status=${{ steps.issue_agent_status.outputs.status }}, quality=${{ steps.issue_agent_status.outputs.quality_status }}, failed_files=${{ steps.issue_agent_status.outputs.failed_files }}"

  notify:
    name: Send Feishu Notification
    needs: analyze
    runs-on: ubuntu-latest
    if: |
      (inputs.send_notification != false || github.event_name == 'schedule') &&
      needs.analyze.outputs.has_report == 'true'
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      FEISHU_AT_MOBILES: ${{ secrets.FEISHU_AT_MOBILES }}
      REPORT_DATE: ${{ needs.analyze.outputs.report_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史，确保获取最新版本

      - name: Pull latest changes
        run: git pull origin main

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Send Feishu notification
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'glm-4.7' }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi
          uv run trendpluse-send-feishu
