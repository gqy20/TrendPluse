name: Run Daily Analysis

on:
  schedule:
    # 每天 UTC 21:00 运行 (北京时间 5:00)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      send_notification:
        description: '是否发送飞书通知'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "run-daily"
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze GitHub Trends
    runs-on: ubuntu-latest
    outputs:
      report_date: ${{ steps.report_date.outputs.date }}
      has_report: ${{ steps.check_report.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run TrendPulse analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/run.py

      - name: Get report date
        id: report_date
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Check if report exists
        id: check_report
        run: |
          if ls reports/daily/report-*.md 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload report artifacts
        if: steps.check_report.outputs.exists == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: trend-report-${{ steps.report_date.outputs.date }}
          path: |
            reports/daily/report-*.md
            reports/daily/report-*.json
          retention-days: 30

      - name: Sync reports to docs
        if: steps.check_report.outputs.exists == 'true'
        run: |
          uv run python scripts/generate_report_index.py

      - name: Commit report and docs
        if: steps.check_report.outputs.exists == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git stash
          git pull --rebase origin main
          git stash pop || true
          # 添加报告文件（包括 JSON 数据）- 使用子目录结构
          git add reports/daily/*.md reports/daily/*.json docs/reports/*.md docs/discovery*.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update daily trend report [skip ci]"
          git push

  deploy:
    name: Build documentation
    needs: analyze
    runs-on: ubuntu-latest
    if: needs.analyze.outputs.has_report == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史，用于 git-revision-date-localized-plugin

      - name: Pull latest changes
        run: git pull origin main

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-awesome-pages-plugin

      - name: Sync reports to docs
        run: |
          uv run python scripts/generate_report_index.py

      - name: Build site
        run: uv run mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: [analyze, deploy]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Get deployment URL
        id: deployment_url
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $URL"

    outputs:
      deployment_url: ${{ steps.deployment_url.outputs.url }}
      report_date: ${{ needs.analyze.outputs.report_date }}

  notify:
    name: Send Feishu Notification
    needs: [analyze, deploy_pages]
    runs-on: ubuntu-latest
    if: |
      (inputs.send_notification != false || github.event_name == 'schedule') &&
      needs.analyze.outputs.has_report == 'true'
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      FEISHU_AT_MOBILES: ${{ secrets.FEISHU_AT_MOBILES }}
      DEPLOYMENT_URL: ${{ needs.deploy_pages.outputs.deployment_url }}
      REPORT_DATE: ${{ needs.analyze.outputs.report_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史，确保获取最新版本

      - name: Download report artifacts
        uses: actions/download-artifact@v7
        with:
          name: trend-report-${{ needs.analyze.outputs.report_date }}
          path: reports

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Send Feishu notification
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi
          uv run python scripts/send_feishu_notification.py

      - name: Upload Feishu card artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: feishu-card-${{ needs.analyze.outputs.report_date }}
          path: feishu_card.json
          retention-days: 30
          if-no-files-found: ignore
