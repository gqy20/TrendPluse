name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v --cov=src/trendpluse --cov-report=xml --cov-report=term

      - name: Build wheel package
        run: uv build --wheel

      - name: Validate installed CLI entrypoints
        run: |
          python -m venv /tmp/trendpluse-wheel-test
          /tmp/trendpluse-wheel-test/bin/pip install dist/*.whl

          /tmp/trendpluse-wheel-test/bin/trendpluse-run --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-run-weekly --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-discover-projects --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-analyze-issues --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-analyze-repo --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-send-feishu --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-send-weekly-feishu --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-add-repo --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-bridge-discovery --help
          /tmp/trendpluse-wheel-test/bin/trendpluse-normalize-daily-stats --help

      - name: Verify coverage file exists
        run: |
          ls -la coverage.xml
          echo "Coverage file generated successfully"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false  # 不要因为 codecov 失败而导致 CI 失败
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}  # 可选，私有仓库需要
