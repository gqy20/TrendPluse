name: Issue Repo Analyzer

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .

      - name: Extract GitHub URL and analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e

          # 获取触发者用户名
          TRIGGER_USER="$ACTOR"
          echo "Triggered by: $TRIGGER_USER"

          # 检查用户权限（必须有 write 或 admin 权限）
          echo "Checking user permissions..."
          PERMISSION=$(gh api repos/{owner}/{repo}/collaborators/$TRIGGER_USER/permission --jq '.permission' 2>/dev/null || echo "none")

          # Bot 用户允许通过
          if [[ "$TRIGGER_USER" == *"[bot]" ]]; then
            echo "✓ Bot user detected: $TRIGGER_USER"
          elif [[ "$PERMISSION" == "write" ]] || [[ "$PERMISSION" == "admin" ]]; then
            echo "✓ User has $PERMISSION permission: $TRIGGER_USER"
          else
            echo "✗ User lacks write permission: $TRIGGER_USER (permission: $PERMISSION)"
            gh issue comment $ISSUE_NUMBER --body "❌ 只有仓库写权限才能使用 @claude 分析功能"
            exit 1
          fi

          # 获取 issue/评论内容
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            BODY="$COMMENT_BODY"
          else
            BODY="$ISSUE_BODY"
          fi

          # 检查是否包含 @claude（不区分大小写）
          if ! echo "$BODY" | grep -i "@claude" > /dev/null; then
            echo "未检测到 @claude 提及，跳过执行"
            exit 0
          fi

          echo "Issue content received"

          # 提取 GitHub URL（支持多种格式）
          REPO_URL=$(echo "$BODY" | grep -oE 'https://github\.com/[^/]+/[^/[:space:]]+' | head -1)

          if [ -z "$REPO_URL" ]; then
            echo "错误：未找到有效的 GitHub URL"
            gh issue comment $ISSUE_NUMBER --body "❌ 未找到有效的 GitHub URL，请提供要分析的仓库地址。"
            exit 1
          fi

          echo "Found repository: $REPO_URL"

          # 提取分析天数（从表单或命令行参数）
          # 优先尝试表单格式："最近一周（7 天）" 或 "--days=14"
          DAYS=$(echo "$BODY" | grep -oP '\d+(?=\s*天)' | head -1)
          if [ -z "$DAYS" ]; then
            DAYS=$(echo "$BODY" | grep -oP '(?<=--days=)\d+' || echo "7")
          fi
          echo "Analysis days: $DAYS"

          # 调用分析脚本
          uv run python scripts/analyze_repo.py "$REPO_URL" --days "$DAYS" --output /tmp/report.md

          # 回复 issue
          gh issue comment $ISSUE_NUMBER --body-file /tmp/report.md

          echo "Analysis completed successfully"
