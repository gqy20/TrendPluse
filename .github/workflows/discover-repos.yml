name: 发现热门项目

on:
  # 每天 UTC 19:00 运行 (北京时间凌晨 3:00)
  schedule:
    - cron: "0 19 * * *"

  # 支持手动触发
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数"
        required: false
        type: number
        default: 30
      min_quality:
        description: "最低质量分数"
        required: false
        type: number
        default: 60.0

  # 允许从其他 workflow 调用
  workflow_call:

permissions:
  contents: write

jobs:
  discover:
    name: 发现热门项目
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Discover projects
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAYS=${{ github.event.inputs.days || 30 }}
          MIN_QUALITY=${{ github.event.inputs.min_quality || 60.0 }}
          uv run python scripts/discover_projects.py \
            --days $DAYS \
            --min-quality $MIN_QUALITY \
            --output-dir reports

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: discovery-reports
          path: reports/discovery/discovery-*.md
          retention-days: 30

      - name: Upload JSON reports
        uses: actions/upload-artifact@v4
        with:
          name: discovery-reports-json
          path: reports/discovery/discovery-*.json
          retention-days: 30

      - name: Sync reports to docs
        run: |
          uv run python scripts/generate_report_index.py

      - name: Commit and push reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/discovery/*.md reports/discovery/*.json docs/discovery-reports/*.md docs/discovery.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update discovery reports [skip ci]"
          git push
