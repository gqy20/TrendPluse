[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trendpluse"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "gqy20", email = "qingyu_ge@foxmail.com" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.13",

]

dependencies = [
    # 核心依赖
    "anthropic>=0.45.0",
    "instructor>=1.6.0",
    "PyGithub>=2.5.0",
    "claude-agent-sdk>=0.1.27",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # 数据采集
    "google-cloud-bigquery>=3.0.0",
    # 模板和文档
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    # 工具库
    "rich>=13.0.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "python-dateutil>=2.9.0",
    # 数据处理
    "pyyaml>=6.0.0",
    "gql[all]>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "respx>=0.21.0",  # HTTP mocking
    "freezegun>=1.5.0",  # 时间 mocking
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/gqy20/trendpluse"
Repository = "https://github.com/gqy20/trendpluse.git"

[project.scripts]
trendpluse-run = "trendpluse.cli.run:main"
trendpluse-run-weekly = "trendpluse.cli.run_weekly:main"
trendpluse-discover-projects = "trendpluse.cli.discover_projects:main"
trendpluse-analyze-issues = "trendpluse.cli.analyze_issues_with_agent:main"
trendpluse-analyze-repo = "trendpluse.cli.analyze_repo:main"
trendpluse-send-feishu = "trendpluse.cli.send_feishu_notification:main"
trendpluse-send-weekly-feishu = "trendpluse.cli.send_weekly_feishu:main"
trendpluse-add-repo = "trendpluse.automation.add_repo:main"
trendpluse-bridge-discovery = "trendpluse.automation.bridge_discovery_to_monitoring:main"
trendpluse-generate-report-index = "trendpluse.automation.generate_report_index:main"
trendpluse-sync-repos-to-docs = "trendpluse.automation.sync_repos_to_docs:main"
trendpluse-normalize-daily-stats = "trendpluse.automation.normalize_daily_report_stats:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trendpluse"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "integration: 标记需要外部依赖或较慢的集成测试",
]

[tool.coverage.run]
source = ["src/trendpluse"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"  # 支持 src layout
explicit_package_bases = true  # 明确使用包基路径
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true

# 忽略 freezegun 的类型问题（第三方库没有类型存根）
[[tool.mypy.overrides]]
module = "freezegun"
ignore_missing_imports = true

# 忽略没有 stubs 的第三方库
[[tool.mypy.overrides]]
module = [
    "pydantic",
    "pydantic.*",
    "anthropic.*",
    "instructor.*",
    "google.cloud.*",
    "dotenv.*",
    "aiohttp.*",
    "github.*",
    "tenacity.*",
    "dateutil.*",
    "yaml.*",
    "pytest.*",
    "pydantic_settings.*",
    "httpx.*",
    "gql.*",              # 新增：GraphQL 客户端
    "graphql_core.*",      # 新增：GraphQL 核心
    "claude_agent_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_missing_imports = true  # 测试中可能导入不存在的模块
disable_error_code = ["abstract", "arg-type"]  # 测试中故意实例化抽象类，简化类型

[[tool.mypy.overrides]]
module = "trendpluse.analyzers.*"
warn_unused_ignores = false  # instructor 返回类型复杂，需要 type: ignore
disable_error_code = ["no-any-return"]  # instructor 返回 Any

# GraphQL 相关代码允许 Any 返回类型
[[tool.mypy.overrides]]
module = "trendpluse.collectors.base"
disable_error_code = ["no-any-return"]
