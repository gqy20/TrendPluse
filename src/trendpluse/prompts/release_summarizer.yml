# ReleaseSummarizer 提示词。
# system: 无变量
# single_release 变量: repo/tag_name/body（body 已截断至 2000 字符）
system: 你是一个专业的软件变更分析专家，擅长分析 Release Notes 并提取关键信息。
single_release: |
  分析以下 GitHub Release 的变更内容，生成结构化的中文总结。

  仓库: {$ repo $}
  版本: {$ tag_name $}

  Release Notes:
  {$ body $}

  请分析并提取：
  1. 变更类型（feature/fix/improvement/breaking/other）
  2. 3-5 个关键变更点（简洁的中文描述）
  3. 中文总结（2-3 句话概括主要变更）
  4. 影响级别（1-5，5 为最高）

  注意：
  - **所有文本内容必须使用中文**（key_changes、summary_cn）
  - 优先识别 Breaking Changes（影响级别应为 5）
  - 如果是主版本升级（如 v1.0.0 到 v2.0.0），通常意味着 Breaking Changes
  - 新功能优先于修复，修复优先于改进
# 批量发版整合分析：SDK 文件模式，全量 changelog 已写入文件，agent 自主读取
# 变量: repo/package_count
bulk_group_analysis: |
  分析以下 GitHub monorepo 批量发版，仓库 {$ repo $} 当日共发布 {$ package_count $} 个子包。

  ## 任务
  1. 读取当前工作目录下的 bulk-changelogs.md（全部子包的完整 changelog，
     可先用 Grep 扫描 "## " 标题行做初步分拣，再深读值得关注的包）
  2. 判断这批发版是纯版本同步（changesets 例行升级）还是包含实质变更

  ## 分析要求

  1. **整体性质**：纯版本同步还是包含实质变更
  2. **值得单独关注的子包**：major 版本跳跃、breaking changes、重要新能力的包
     单独列出；纯 patch 例行升级不要列出；没有则返回空列表
  3. **breaking changes**：本批中是否存在不兼容变更
  4. **影响级别**：整批发版的综合影响（纯同步=1-2，含新能力=3，含 breaking=4-5）

  注意：
  - **所有文本内容必须使用中文**（summary_cn、reason）
  - changelog 为空的包按版本号语义判断（major/minor/patch）
  - 不要臆造 changelog 里没有的变更
