# TrendAnalyzer 提示词。
# pr_signal_extraction 变量: number/title/body/repo/author/url
# aggregation 变量: date/pr_count/commit_count/release_count/pr_text/commit_text/release_text（text 由 _format_signals_with_ids 预计算）
pr_signal_extraction: |
  分析以下 GitHub PR，提取趋势信号。

  PR 编号: {$ number $}
  PR 标题: {$ title $}
  PR 描述: {$ body $}
  仓库: {$ repo $}
  作者: {$ author $}
  链接: {$ url $}

  ## category 判定标准

  - engineering（默认）：功能交付、bug 修复、重构、适配接入、安全加固、UX 改进
  - research（仅当明确符合以下之一）：新算法或新架构；论文（arXiv/DOI）的实现；新评测方法或基准；实验性范式探索
  - 拿不准时选 engineering，防止过度分类

  请提取关键信息并返回结构化信号。
aggregation: |
  分析以下多种类型的 GitHub 活动，识别高层次的技术趋势。

  日期: {$ date $}

  ## 数据统计
  - PR 信号: {$ pr_count $} 个
  - Commit 技术点: {$ commit_count $} 个
  - Release 信号: {$ release_count $} 个

  ## PR 信号
  {$ pr_text $}

  ## Commit 技术点
  {$ commit_text $}

  ## Release 信号
  {$ release_text $}

  ## 分析要求

  请识别**跨类型的模式和趋势**，例如：
  - 多个项目同时推出相似功能（可能同时出现在 PR 和 Commit 中）
  - 技术方向的集体演进（多个相关变更指向同一趋势）
  - 重要版本发布与相关 PR/Commit 的关联

  ## 输出要求

  返回一份 DailyReport，只包含以下字段：
  1. date: 日期字符串
  2. summary_brief: 当日总览（2-3 句话）
  3. engineering_signals: 聚合后的高层次工程趋势列表
  4. research_signals: 聚合后的高层次研究趋势列表（仅当上游无 research 类信号时为空；上游存在 research 信号时必须聚合，不得丢弃）

  **以下字段由代码自动填充，无需返回**：
  - activity: 仓库活跃度数据（代码采集）
  - releases: Release 数据（代码采集）
  - breaking_changes: 不兼容变更（代码检测）
  - monitored_repos: 监控仓库列表（代码配置）

  重要：
  - **source_signal_ids 字段必须填写**，用于后续溯源
  - ID 格式为 "类型-索引"，例如 "pr-0", "commit-1", "release-2"
  - **所有文本内容必须使用中文**（title、why_it_matters、summary_brief 等）
  - 只返回真正有价值的跨类型趋势
  - 如果没有发现明显的跨类型模式，返回空信号列表但保留 summary
